name: Publish APT repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4

      - name: Checkout APT repository
        uses: actions/checkout@v4
        with:
          repository: nobodypp/jelly-mayhem-apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Test GPG key
        run: |
          gpg --list-secret-keys --keyid-format LONG

      - name: Test repository access
        run: |
          cd apt-repo
          git status

      - name: Test commit
        run: |
          cd apt-repo

          echo "GitHub Actions test" > .github-actions-test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github-actions-test
          git commit -m "Test GitHub Actions publishing"

      - name: Push APT repository
        run: |
          cd apt-repo
          git push origin main