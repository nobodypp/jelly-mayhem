name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # Release Please
  # ==========================================================

  release-please:

    name: Release Please

    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:

      - name: Release Please
        id: release
        uses: release-please-oss/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple


  # ==========================================================
  # Build Linux + Windows packages
  # ==========================================================

  build:

    name: ${{ matrix.name }}

    needs: release-please

    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Linux Release
            preset: linux-release
            package: "*.tar.gz"

          - name: Windows Release
            preset: windows-release
            package: "*.zip"

    steps:

      # ------------------------------------------------------
      # Checkout the released commit
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # Set version from Release Please tag
      # ------------------------------------------------------

      - name: Set version
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "PROJECT1_VERSION=$VERSION" >> "$GITHUB_ENV"


      - name: Show version
        run: |
          echo "Building Project1 version $PROJECT1_VERSION"


      # ------------------------------------------------------
      # Windows cross-compilation dependencies
      # ------------------------------------------------------

      - name: Install Windows Tools
        if: matrix.preset == 'windows-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            ntldd


      # ------------------------------------------------------
      # Linux build dependencies
      # ------------------------------------------------------

      - name: Install Linux Tools
        if: matrix.preset == 'linux-release'
        run: ./scripts/setup-ubuntu.sh


      # ------------------------------------------------------
      # Configure
      # ------------------------------------------------------

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DPROJECT1_VERSION=${{ env.PROJECT1_VERSION }}


      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}


      # ------------------------------------------------------
      # Install
      # ------------------------------------------------------

      - name: Install
        run: |
          cmake --install build/${{ matrix.preset }}


      # ------------------------------------------------------
      # Package
      # ------------------------------------------------------

      - name: Package
        run: |
          cpack --preset ${{ matrix.preset }}-package


      # ------------------------------------------------------
      # Upload package as workflow artifact
      # ------------------------------------------------------

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: Project1-${{ matrix.name }}
          path: build/${{ matrix.preset }}/${{ matrix.package }}


  # ==========================================================
  # Add packages to GitHub Release
  # ==========================================================

  upload-release:

    name: Add packages to GitHub Release

    needs:
      - release-please
      - build

    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Download Linux + Windows packages
      # ------------------------------------------------------

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: release


      # ------------------------------------------------------
      # Show downloaded files
      # ------------------------------------------------------

      - name: List release files
        run: |
          find release -type f -print


      # ------------------------------------------------------
      # Upload packages to existing GitHub Release
      # ------------------------------------------------------

      - name: Upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            release/**/*.tar.gz
            release/**/*.zip