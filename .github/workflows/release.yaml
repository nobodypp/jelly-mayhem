name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # Release Please
  # ==========================================================

  release-please:

    name: Release Please

    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:

      - name: Release Please
        id: release
        uses: release-please-oss/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple


  # ==========================================================
  # Build Linux + Windows packages
  # ==========================================================

  build:

    name: ${{ matrix.name }}

    needs: release-please

    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Linux Release
            preset: linux-release

          - name: Windows Release
            preset: windows-release

    steps:

      # ------------------------------------------------------
      # Checkout the released commit
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # Set version from Release Please tag
      # ------------------------------------------------------

      - name: Set version
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          echo "GAME_VERSION=$VERSION" >> "$GITHUB_ENV"


      - name: Show version
        run: |
          echo "Building Jelly-Mayhem version $GAME_VERSION"


      # ------------------------------------------------------
      # Windows cross-compilation dependencies
      # ------------------------------------------------------

      - name: Install Windows Tools
        if: matrix.preset == 'windows-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            nsis

      # ------------------------------------------------------
      # Linux build dependencies
      # ------------------------------------------------------

      - name: Install Linux Tools
        if: matrix.preset == 'linux-release'
        run: ./scripts/setup-ubuntu.sh


      # ------------------------------------------------------
      # Configure
      # ------------------------------------------------------

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DGAME_VERSION=${{ env.GAME_VERSION }}


      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}


      # ------------------------------------------------------
      # Package
      # ------------------------------------------------------

      - name: Package
        run: |
          cpack --preset ${{ matrix.preset }}-package


      # ------------------------------------------------------
      # Upload package as workflow artifact
      # ------------------------------------------------------

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: Project1-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/*.deb
            build/${{ matrix.preset }}/*.exe
            build/${{ matrix.preset }}/*.zip


  # ==========================================================
  # Add packages to GitHub Release
  # ==========================================================

  upload-release:

    name: Add packages to GitHub Release

    needs:
      - release-please
      - build

    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Download Linux + Windows packages
      # ------------------------------------------------------

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: release


      # ------------------------------------------------------
      # Show downloaded files
      # ------------------------------------------------------

      - name: List release files
        run: |
          find release -type f -print


      # ------------------------------------------------------
      # Upload packages to existing GitHub Release
      # ------------------------------------------------------

      - name: Upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            release/**/*.deb
            release/**/*.exe
            release/**/*.zip
  
  # ==========================================================
  # Publish Linux package to APT repository
  # ==========================================================

  publish-apt:

    name: Publish APT repository

    needs:
      - release-please
      - build

    if: needs.release-please.outputs.release_created == 'true'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ------------------------------------------------------
      # Checkout game repository
      # ------------------------------------------------------

      - name: Checkout game repository
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # Checkout APT repository
      # ------------------------------------------------------

      - name: Checkout APT repository
        uses: actions/checkout@v5
        with:
          repository: nobodypp/jelly-mayhem-apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo


      # ------------------------------------------------------
      # Download Linux package
      # ------------------------------------------------------

      - name: Download Linux package
        uses: actions/download-artifact@v5
        with:
          name: Project1-Linux Release
          path: linux-package


      # ------------------------------------------------------
      # Show downloaded package
      # ------------------------------------------------------

      - name: List Linux package
        run: |
          find linux-package -type f -print


      # ------------------------------------------------------
      # Set version
      # ------------------------------------------------------

      - name: Set version
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"

          echo "GAME_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Publishing Jelly-Mayhem version $VERSION"


      # ------------------------------------------------------
      # Import GPG signing key
      # ------------------------------------------------------

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import


      # ------------------------------------------------------
      # Copy package into repository
      # ------------------------------------------------------

      - name: Add package to APT repository
        shell: bash
        run: |
          set -e

          PACKAGE=$(find linux-package -name '*.deb' -type f | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Linux .deb package not found"
            exit 1
          fi

          DEST="apt-repo/pool/main/j/jelly-mayhem"

          mkdir -p "$DEST"

          cp "$PACKAGE" "$DEST/Jelly-Mayhem-${GAME_VERSION}-Linux.deb"

          echo "Added:"
          ls -lh "$DEST"


      # ------------------------------------------------------
      # Generate Packages
      # ------------------------------------------------------

      - name: Generate Packages
        shell: bash
        run: |
          set -e

          cd apt-repo

          mkdir -p dists/stable/main/binary-amd64

          dpkg-scanpackages \
            pool \
            /dev/null \
            > dists/stable/main/binary-amd64/Packages

          gzip -9 -kf \
            dists/stable/main/binary-amd64/Packages

          echo "Packages generated:"
          ls -lh dists/stable/main/binary-amd64/


      # ------------------------------------------------------
      # Generate Release metadata
      # ------------------------------------------------------

      - name: Generate Release metadata
        shell: bash
        run: |
          set -e

          cd apt-repo/dists/stable

          cat > release.conf <<'EOF'
          APT::FTPArchive::Release::Origin "Jelly-Mayhem";
          APT::FTPArchive::Release::Label "Jelly-Mayhem";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          EOF

          apt-ftparchive \
            -c release.conf \
            release . \
            > Release

          rm -f InRelease Release.gpg

          echo "Release metadata:"
          cat Release


      # ------------------------------------------------------
      # Sign repository metadata
      # ------------------------------------------------------

      - name: Sign APT repository
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e

          cd apt-repo/dists/stable

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor \
            --detach-sign \
            -o Release.gpg \
            Release

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor \
            --clearsign \
            -o InRelease \
            Release

          echo "Signed repository:"
          ls -lh InRelease Release Release.gpg


      # ------------------------------------------------------
      # Show repository status
      # ------------------------------------------------------

      - name: Show repository changes
        run: |
          cd apt-repo
          git status --short


      # ------------------------------------------------------
      # Commit
      # ------------------------------------------------------

      - name: Commit APT repository
        shell: bash
        run: |
          set -e

          cd apt-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            pool \
            dists/stable

          git commit \
            -m "Publish Jelly-Mayhem ${GAME_VERSION}"


      # ------------------------------------------------------
      # Push
      # ------------------------------------------------------

      - name: Push APT repository
        run: |
          cd apt-repo
          git push origin main