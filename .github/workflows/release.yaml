name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:
    name: ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: Linux Release
            preset: linux-release
            package: "*.tar.gz"

          - name: Windows Release
            preset: windows-release
            package: "*.zip"

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5


      # ------------------------------------------------------
      # Set version from Git tag
      # ------------------------------------------------------

      - name: Set version
        shell: bash
        run: |
          echo "PROJECT1_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"


      - name: Show version
        run: |
          echo "Building Project1 version $PROJECT1_VERSION"


      # ------------------------------------------------------
      # Windows cross-compilation dependencies
      # ------------------------------------------------------

      - name: Install Windows Tools
        if: matrix.preset == 'windows-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            ntldd
      

      # Linux dev tools

      - name: Install Linux Tools
        if: matrix.preset == 'linux-release'
        run: ./scripts/setup-ubuntu.sh


      # ------------------------------------------------------
      # Configure
      # ------------------------------------------------------

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DPROJECT1_VERSION=${{ env.PROJECT1_VERSION }}


      # ------------------------------------------------------
      # Build
      # ------------------------------------------------------

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}


      # ------------------------------------------------------
      # Install
      # ------------------------------------------------------

      - name: Install
        run: |
          cmake --install build/${{ matrix.preset }}


      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Package
        run: |
          cpack --preset ${{ matrix.preset }}-package


      # --------------------------------------------------------
      # Upload package
      # --------------------------------------------------------

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Project1-${{ matrix.name }}
          path: build/${{ matrix.preset }}/${{ matrix.package }}


  # ==========================================================
  # Create GitHub Release
  # ==========================================================

  create-release:

    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download Linux + Windows packages
      # --------------------------------------------------------

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: release


      # --------------------------------------------------------
      # Show downloaded files
      # --------------------------------------------------------

      - name: List release files
        run: |
          find release -type f -print


      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.zip
          generate_release_notes: true