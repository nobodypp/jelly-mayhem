name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ==========================================================
  # Linux
  # ==========================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: ./scripts/setup-ubuntu.sh

      - name: Set version
        shell: bash
        run: |
          echo "PROJECT1_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Show version
        run: echo "Building Project1 version ${{ env.PROJECT1_VERSION }}"

      - name: Configure
        run: |
          cmake --preset linux-release \
            -DPROJECT1_VERSION=${{ env.PROJECT1_VERSION }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Install
        run: cmake --install build/linux-release

      - name: Package
        run: cpack --preset linux-release-package

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Project1-Linux
          path: build/linux-release/*.tar.gz


  # ==========================================================
  # Windows
  # ==========================================================

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            ntldd

      - name: Set version
        shell: bash
        run: |
          echo "PROJECT1_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Show version
        run: echo "Building Project1 version ${{ env.PROJECT1_VERSION }}"

      - name: Configure
        run: |
          cmake --preset windows-release \
            -DPROJECT1_VERSION=${{ env.PROJECT1_VERSION }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Install
        run: cmake --install build/windows-release

      - name: Package
        run: cpack --preset windows-release-package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Project1-Windows
          path: build/windows-release/*.zip


  # ==========================================================
  # GitHub Release
  # ==========================================================

  create-release:
    name: Create GitHub Release

    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    steps:

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: Project1-Linux
          path: release/linux

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: Project1-Windows
          path: release/windows

      - name: Show release files
        run: |
          echo "Release files:"
          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/linux/*
            release/windows/*